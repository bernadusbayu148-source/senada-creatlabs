name: Senada backend syntax checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php-and-js-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Check PHP syntax
        run: |
          set -e
          find backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run backend helper smoke checks
        run: php backend/tests/smoke.php

      - name: Check JavaScript syntax
        run: |
          set -e
          node --check admin/admin.js
          node --check admin/ai-assistant.js
          node --check admin/preview-projects.js
          node --check backend/admin-public/auth.js
          node --check preview-lab/app.js
          node --check preview-lab/agent-workbench.js
